{{- range $name, $port := dict "api" 8080 "web" 3000 "operator" 8081 }}
apiVersion: v1
kind: Service
metadata:
  name: qps-{{ $name }}
  labels:
    app: qps-{{ $name }}
spec:
  selector:
    app: qps-{{ $name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
---
{{- end }}
{{- range $name, $arn := .Values.targetGroups }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: qps-{{ $name }}
spec:
  targetGroupARN: {{ $arn | quote }}
  targetType: ip
  serviceRef:
    name: qps-{{ $name }}
    port: {{ if eq $name "api" }}8080{{ else }}3000{{ end }}
---
{{- end }}
{{- if .Values.monitoring }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qps-api
  labels:
    release: qps-monitoring
spec:
  selector:
    matchLabels:
      app: qps-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
