{{- range $name, $port := dict "api" 8080 "web" 3000 "operator" 8081 }}
apiVersion: v1
kind: Service
metadata:
  name: qps-{{ $name }}
  labels:
    app: qps-{{ $name }}
spec:
  selector:
    app: qps-{{ $name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
---
{{- end }}
{{- range $name, $arn := .Values.targetGroups }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: qps-{{ $name }}
spec:
  targetGroupARN: {{ $arn | quote }}
  targetType: ip
  serviceRef:
    name: qps-{{ $name }}
    port: {{ if eq $name "api" }}8080{{ else }}3000{{ end }}
---
{{- end }}
{{- if .Values.monitoring }}
{{- range $name := list "api" "operator" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qps-{{ $name }}
  labels:
    release: qps-monitoring
spec:
  selector:
    matchLabels:
      app: qps-{{ $name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qps-platform
  labels:
    release: qps-monitoring
spec:
  groups:
    - name: qps-platform
      rules:
        - alert: QPSServiceUnavailable
          expr: up{namespace="qps",job=~"qps-api|qps-operator"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: QPS service is unavailable
        - alert: QPSControllerReconcileErrors
          expr: sum(rate(controller_runtime_reconcile_errors_total{namespace="qps"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: QPS controller reconciliation is failing
        - alert: QPSWorkerTelemetryStale
          expr: qps_worker_telemetry_stale{namespace="qps"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: QPS worker telemetry is stale
{{- end }}
