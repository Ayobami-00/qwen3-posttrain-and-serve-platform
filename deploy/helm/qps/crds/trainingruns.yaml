{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "trainingruns.qps.dev"
  },
  "spec": {
    "group": "qps.dev",
    "names": {
      "kind": "TrainingRun",
      "plural": "trainingruns",
      "singular": "trainingrun"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "required": [
              "spec"
            ],
            "properties": {
              "spec": {
                "type": "object",
                "required": [
                  "ownerId",
                  "generation",
                  "action"
                ],
                "properties": {
                  "ownerId": {
                    "type": "string"
                  },
                  "generation": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "action": {
                    "type": "string",
                    "enum": [
                      "run",
                      "cancel",
                      "stop",
                      "resume",
                      "retry-evaluation"
                    ]
                  }
                }
              },
              "status": {
                "type": "object",
                "properties": {
                  "phase": {
                    "type": "string"
                  },
                  "allocationId": {
                    "type": "string"
                  },
                  "observedGeneration": {
                    "type": "integer",
                    "format": "int64"
                  },
                  "message": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    ]
  }
}
