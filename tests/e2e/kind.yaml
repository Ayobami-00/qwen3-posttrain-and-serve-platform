kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        apiVersion: kubelet.config.k8s.io/v1beta1
        # CodeBuild's disposable Docker host still uses cgroup v1. EKS AL2023
        # uses cgroup v2 and never consumes this test-only compatibility file.
        failCgroupV1: false
